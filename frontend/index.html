<main>

  <section id="top" class="hero-full">
    <h1 class="visually-hidden">FOLIX</h1>

    <!--
      Hero media. The wordmark, ring and corner marks are part of the footage
      itself, so nothing is layered on top of it. The footage sits on a
      "stage" that always covers the hero; the buttons are positioned in the
      stage's own coordinates (see .hero-actions), so they stay in the same
      clear spot beside the figure at every screen size.

      Two versions of the same footage ship, chosen at runtime by
      hero-media.js / hero-media-mobile.js (never both loaded):

        Desktop (pointer: fine, wider screens) - the 16:9 cut, played by the
        cursor, not by time: it scrubs a pre-cut frame sequence
        (assets/hero/hero-frames.*, built by tools/build_hero_frames.py).

        Mobile (the @media breakpoint below) - a 9:16 cut of the same
        footage (assets/hero/hero-mobile.mp4) so phones aren't pulling the
        4+ MB desktop frame set. It idles as a looping video and a touch
        drag scrubs it with the identical spring used on desktop, just
        driving video.currentTime instead of a canvas frame index.

      Each version's <img> is the instant first paint and the fallback
      (reduced motion, missing browser feature, or the asset failing to
      load).
    -->
    <div class="hero-media"
         data-hero-media
         data-hero-manifest="assets/hero/hero-frames.json"
         data-hero-frames="assets/hero/hero-frames.bin">
      <div class="hero-stage" data-hero-stage>
        <img class="hero-stage-asset" data-hero-poster src="assets/hero/hero-poster.webp" alt="" />
        <canvas class="hero-stage-asset" data-hero-canvas hidden
                role="img"
                aria-label="A dark bust overgrown with ivy. Its head turns to follow your cursor."></canvas>
      </div>
    </div>

    <div class="hero-media hero-media-mobile"
         data-hero-media-mobile
         data-hero-video-src="assets/hero/hero-mobile.mp4">
      <div class="hero-stage hero-stage-mobile" data-hero-stage-mobile>
        <img class="hero-stage-asset" data-hero-poster-mobile src="assets/hero/hero-mobile-poster.webp" alt="" />
        <video class="hero-stage-asset" data-hero-video hidden
               muted playsinline webkit-playsinline preload="auto" loop
               aria-label="A dark bust overgrown with ivy. Drag to turn its head."></video>
      </div>
    </div>

    <div class="hero-actions">
      <a href="scanner.html" class="btn btn-primary">Scan your crop</a>
      <a href="how-it-works.html" class="btn btn-ghost">How it works</a>
    </div>
  </section>

</main>

    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.warn("Service worker registration failed:", err));
    });
  }
</script>
