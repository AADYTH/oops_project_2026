<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOLIX — Create account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="auth.css" />
<meta name="theme-color" content="#1F3B2A" />
</head>
<body data-page="register">

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="index.html" aria-label="FOLIX — Home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><path d="M16 2C9 8 6 14 6 19a10 10 0 0 0 20 0c0-5-3-11-10-17Z" fill="currentColor"/></svg>
      </span>
      <span class="brand-name">FOLIX</span>
    </a>
  </div>
</header>
<script src="protocol-check.js"></script>
<script src="nav.js"></script>
<script src="auth.js"></script>

<main class="wrap auth-page">
  <div class="auth-card" id="registerCard">
    <h1>Create your account</h1>
    <p class="auth-lede">A FOLIX account lets you save scan reports and come back to them later.</p>

    <form id="registerForm" novalidate>
      <div class="auth-field">
        <label for="regName">Name</label>
        <input id="regName" name="name" type="text" autocomplete="name" maxlength="100" required />
        <p class="auth-field-error" id="regNameError" hidden></p>
      </div>
      <div class="auth-field">
        <label for="regEmail">Email</label>
        <input id="regEmail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required />
        <p class="auth-field-error" id="regEmailError" hidden></p>
      </div>
      <div class="auth-field">
        <label for="regPassword">Password</label>
        <input id="regPassword" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <p class="auth-hint">At least 8 characters.</p>
        <p class="auth-field-error" id="regPasswordError" hidden></p>
      </div>
      <div class="auth-field">
        <label for="regConfirm">Confirm password</label>
        <input id="regConfirm" name="confirm" type="password" autocomplete="new-password" required />
        <p class="auth-field-error" id="regConfirmError" hidden></p>
      </div>
      <p class="auth-error" id="registerError" role="alert" hidden></p>
      <button class="btn btn-primary btn-large" id="registerSubmit" type="submit">Create account</button>
    </form>

    <p class="auth-alt">Already have an account? <a id="loginLink" href="login.html">Log in</a></p>
    <p class="auth-alt">Are you an agriculture extension authority? <a href="authority.html#register" id="authorityRegisterLink">Register your office here</a></p>
  </div>
</main>

<script src="auth-pages.js"></script>
</body>
</html>
